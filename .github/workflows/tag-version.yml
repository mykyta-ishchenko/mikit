name: Tag version

on:
  push:
    branches: [main]
    paths: [.claude-plugin/plugin.json]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag the commit with its version unless already tagged
        run: |
          tag="v$(jq -r .version .claude-plugin/plugin.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
